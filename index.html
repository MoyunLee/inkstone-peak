<!doctype html>
<!-- 预渲染壳（meta 注入式）：下方 <html lang> / title / description / canonical 为固定替换锚点，
     构建后由 scripts/pre-render.ts 按路由逐份覆写——此处手改值无意义，话术唯一家在 site.yml（lang 取 site.lang）。
     ★2026-09-11 用户令：**OG 全套移除**；★2026-10-03 用户令**恢复**（用户令 D3）：og:* / twitter:* / article:*
       由 pre-render 按路由写进下面那行「OG」锚点注释，全站共用一张手工默认卡 /og/default.png（配方 scripts/og-card.ts）。
       恢复不等于回退到旧形态：不恢复 `og_default` 配置键，也不在构建链里出图（PNG 带字依赖本机字体）。
       canonical 保留并逐路由覆写（站内既有词汇：旧地址重定向桩本就带 canonical），故 `site.url` 仍有消费者。
       头部另有一枚 JSONLD 锚点注释（即「JSONLD」那行）：构建期换成该路由的结构化数据，模型见 src/lib/meta/jsonld.ts。
       它刻意只做构建期——SPA 换页不改写这段数据，缘由写在模块头部与 Dev_Docs 90 的 §4.8。 -->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>砚山 · 作品集</title>
    <meta name="description" content="三维美术管线 × AIGC 产能 —— 从概念到成片，每一环都能指出是谁的手艺。" />
    <link rel="canonical" href="https://moyunlee.cn/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="alternate" type="application/rss+xml" href="/rss.xml" />
    <!--OG-->
    <!--JSONLD-->
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
    <!-- 无 JS 降级：仅 Hero 段预留底图位——assets.ts 预烘程序化数据山静帧（与 canvas 同一份山形数据） -->
    <noscript><img src="/hero-base.png" alt="" style="position:fixed;inset:0;width:100vw;height:100svh;object-fit:cover;mix-blend-mode:multiply" /></noscript>
    <!-- 预渲染正文（构建期 SSR 注入，见 src/entry-server.tsx + scripts/pre-render.ts）：
         首帧与爬虫看这一块；React 一提交由 CSS 隐去、由 DropPrerender 摘除。本行是替换锚点，勿改。 -->
    <div id="prerender"></div>
  </body>
</html>

<!doctype html>
<!-- 预渲染壳（10 §3.2 V1 meta 注入式）：下方 <html lang> / title / description / canonical 为固定替换锚点，

     ★2026-09-11 用户令：**OG 全套移除**（og:site_name/type/title/description/url/image 六个标签全删）

<html lang="zh-CN">

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="alternate" type="application/rss+xml" href="/rss.xml" />
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
    <!-- 无 JS 降级（20 §3）：V1 仅 Hero 段预留底图位——assets.ts 预烘程序化数据山静帧；真源画 M4 换 -->
    <noscript><img src="/hero-base.png" alt="" style="position:fixed;inset:0;width:100vw;height:100svh;object-fit:cover;mix-blend-mode:multiply" /></noscript>

    <div id="prerender"></div>
